name: Docker Build and Push

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.4.5)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/wan-music

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 镜像 tag: 去掉 ref name / 输入 tag 的 'v' 前缀，与 semver 一致
          #   push tag v1.4.7 → image tag 1.4.7
          #   workflow_dispatch tag=v1.4.7 → image tag 1.4.7
          tags: |
            type=raw,value=${{ github.event.inputs.tag || github.ref_name }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') && !contains(github.event.inputs.tag, '-') }}
            type=raw,value=latest-prerelease,enable=${{ contains(github.ref_name, '-') || contains(github.event.inputs.tag, '-') }}
          labels: |
            org.opencontainers.image.title=Wan Music
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## 🐳 Docker 镜像 (GHCR)

            镜像已推送到 GitHub Container Registry：

            ```bash
              docker run -d \
                --name wan-music \
                -p 6005:6005 \
                -v $(pwd)/cookie:/app/cookie \
                -v $(pwd)/downloads:/app/downloads \
                -v $(pwd)/logs:/app/logs \
                --restart unless-stopped \
                ghcr.io/${{ github.repository_owner }}/wan-music:${{ github.ref_name }}
            ```

            **访问地址**：`http://localhost:6005`
