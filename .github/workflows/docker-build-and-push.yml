name: Docker Build and Push

# ============================================================
# 触发条件：
#   push tag (v*.*.* 或 v*.*.*-*)  → 构建并推送镜像到 GHCR
#   push main 分支 → 构建并推送为 :main（用于预览/调试，可选）
# ============================================================

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
    branches:
      - main

# 避免重复运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # GitHub Container Registry（ghcr.io）
  # 镜像名固定为 ghcr.io/<owner>/wan-music（小写，避免 GHA 自动转小写不一致）
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/wan-music

jobs:
  # ============================================================
  # Job 1: 构建并推送镜像（核心任务）
  # ============================================================
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GHCR 推送需要 packages: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ============================================================
      # 登录 GHCR（使用内置 GITHUB_TOKEN，无需配置 secret）
      # ============================================================
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 从 ref 提取版本号：
      #   tag (refs/tags/vX.Y.Z) → version=X.Y.Z
      #   main 分支推送          → version=main-<7位sha>
      # ============================================================
      - name: Compute version from ref
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # tag：去掉 refs/tags/v 前缀
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            # main 分支：用短 commit SHA 标识
            VERSION="main-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Ref: $GITHUB_REF → version=$VERSION"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # tag 策略：
          #   push tag v1.2.3      → 1.2.3, latest
          #   push tag v1.2.3-rc1  → 1.2.3-rc1, latest-prerelease（用 prerelease 取代 latest）
          #   push main            → main-<sha>（不动 latest）
          # 注：enable= 用 GHA 表达式 ${{ ... }}，不是 metadata-action 模板 {{ }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=raw,value=latest-prerelease,enable=${{ startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Wan Music
            org.opencontainers.image.description=多平台音乐搜索/解析/下载
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 构建缓存：加速重复构建
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Job 2: 创建 GitHub Release（仅 tag 触发）
  # ============================================================
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version (strip v prefix)
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ## 🐳 Docker 镜像（GHCR）

            镜像已推送到 GitHub Container Registry：

            ```bash
              # 一键启动（匿名拉取）
              docker run -d \
                --name wan-music \
                -p 6005:6005 \
                --restart unless-stopped \
                ghcr.io/${{ github.repository_owner }}/wan-music:${{ steps.version.outputs.version }}

              # 或使用 docker compose
              WAN_MUSIC_IMAGE=ghcr.io/${{ github.repository_owner }}/wan-music:${{ steps.version.outputs.version }} \
                docker compose up -d
            ```

            > 💡 首次拉取需登录：`echo ${{ github.token }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin`
            > （仅对私有仓库，公开镜像可直接拉取）

            **访问地址**：`http://localhost:6005`
